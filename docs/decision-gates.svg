<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2341"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="60" y="72" font-size="38" font-weight="700" fill="#0b2341">Five gates between a request and its answer</text>
  <text x="60" y="108" font-size="21" fill="#44546a">Each gate may only make the outcome stricter. Rules decide; AI advises; a person has the final say on anything unclear.</text>

  <!-- Request -->
  <rect x="60" y="300" width="130" height="150" rx="12" fill="#f4f6f9" stroke="#c9d1dc" stroke-width="2"/>
  <text x="125" y="365" font-size="22" font-weight="700" fill="#0b2341" text-anchor="middle">Request</text>
  <text x="125" y="395" font-size="15" fill="#44546a" text-anchor="middle">purpose,</text>
  <text x="125" y="416" font-size="15" fill="#44546a" text-anchor="middle">question,</text>
  <text x="125" y="437" font-size="15" fill="#44546a" text-anchor="middle">definitions</text>

  <!-- Gates -->
  <g stroke-width="2.5">
    <rect x="230" y="260" width="220" height="230" rx="12" fill="#ffffff" stroke="#0b2341"/>
    <rect x="490" y="260" width="220" height="230" rx="12" fill="#ffffff" stroke="#7a869a" stroke-dasharray="8 5"/>
    <rect x="750" y="260" width="220" height="230" rx="12" fill="#ffffff" stroke="#0b2341"/>
    <rect x="1010" y="260" width="220" height="230" rx="12" fill="#ffffff" stroke="#0b2341"/>
    <rect x="1270" y="260" width="220" height="230" rx="12" fill="#fff8e6" stroke="#d9a400"/>
  </g>

  <!-- Gate kind badges -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="275" y="243" width="130" height="30" rx="15" fill="#0b2341"/><text x="340" y="263" fill="#fff">DETERMINISTIC</text>
    <rect x="555" y="243" width="90" height="30" rx="15" fill="#7a869a"/><text x="600" y="263" fill="#fff">LLM</text>
    <rect x="795" y="243" width="130" height="30" rx="15" fill="#0b2341"/><text x="860" y="263" fill="#fff">DETERMINISTIC</text>
    <rect x="1055" y="243" width="130" height="30" rx="15" fill="#0b2341"/><text x="1120" y="263" fill="#fff">DETERMINISTIC</text>
    <rect x="1335" y="243" width="90" height="30" rx="15" fill="#b8860b"/><text x="1380" y="263" fill="#fff">HUMAN</text>
  </g>

  <!-- Gate titles -->
  <g font-size="24" font-weight="700" fill="#0b2341" text-anchor="middle">
    <text x="340" y="310">1 · Purpose rules</text>
    <text x="600" y="310">2 · Second opinion</text>
    <text x="860" y="310">3 · Definitions</text>
    <text x="1120" y="310">4 · Data rules</text>
    <text x="1380" y="310">5 · Staff</text>
  </g>
  <!-- Gate bodies -->
  <g font-size="15" fill="#44546a" text-anchor="middle">
    <text x="340" y="342">regex phrases per rule,</text>
    <text x="340" y="363">Art. 53 allowed, Art. 54</text>
    <text x="340" y="384">prohibited, negation-aware,</text>
    <text x="340" y="405">versioned (1.0.3)</text>

    <text x="600" y="342">Mistral reads the purpose:</text>
    <text x="600" y="363">"could this still be an</text>
    <text x="600" y="384">Art. 54 use?" · runs in</text>
    <text x="600" y="405">parallel, never decides</text>

    <text x="860" y="342">fixed grammar builds a</text>
    <text x="860" y="363">checked query plan;</text>
    <text x="860" y="384">unreadable wording →</text>
    <text x="860" y="405">LLM rewrite, shown</text>

    <text x="1120" y="342">opt-outs removed first;</text>
    <text x="1120" y="363">statistics or secure</text>
    <text x="1120" y="384">environment; groups</text>
    <text x="1120" y="405">under 10 hidden</text>

    <text x="1380" y="342">signed-in reviewer</text>
    <text x="1380" y="363">approves or overrides,</text>
    <text x="1380" y="384">AI memo + guidance,</text>
    <text x="1380" y="405">every action audited</text>
  </g>
  <!-- Gate powers -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="340" y="465" fill="#c8102e">can reject · allow · hold</text>
    <text x="600" y="465" fill="#b8860b">can only hold</text>
    <text x="860" y="465" fill="#b8860b">can only hold</text>
    <text x="1120" y="465" fill="#1b7f3b">can reduce what is shown</text>
    <text x="1380" y="465" fill="#0b2341">final say on held cases</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#0b2341" stroke-width="2.5" marker-end="url(#a)">
    <line x1="190" y1="375" x2="228" y2="375"/>
    <line x1="450" y1="375" x2="488" y2="375"/>
    <line x1="710" y1="375" x2="748" y2="375"/>
    <line x1="970" y1="375" x2="1008" y2="375"/>
  </g>

  <!-- Outcomes -->
  <g font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="230" y="600" width="220" height="48" rx="24" fill="#c8102e"/><text x="340" y="630">NO · reason + law quoted</text>
    <rect x="750" y="600" width="220" height="48" rx="24" fill="#1b7f3b"/><text x="860" y="630">YES · statistics</text>
    <rect x="1010" y="600" width="220" height="48" rx="24" fill="#1f5fa8"/><text x="1120" y="630">YES · secure environment</text>
    <rect x="1270" y="600" width="220" height="48" rx="24" fill="#b8860b"/><text x="1380" y="630">HELD · a person decides</text>
  </g>
  <!-- outcome arrows -->
  <line x1="340" y1="490" x2="340" y2="598" stroke="#c8102e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="328" y="575" font-size="14" fill="#c8102e" text-anchor="end">prohibited</text>
  <path d="M1090,490 V560 H900 V598" fill="none" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1150" y1="490" x2="1150" y2="598" stroke="#1f5fa8" stroke-width="2.5" marker-end="url(#a)"/>
  <g stroke="#b8860b" stroke-width="2.5" fill="none" marker-end="url(#ay)">
    <path d="M400,490 V545 H1320 V598"/>
    <path d="M600,490 V545"/>
    <path d="M860,490 V545"/>
  </g>
  <text x="412" y="566" font-size="14" fill="#b8860b">unclear · suspect · unreadable · AI-touched → held</text>
  <path d="M1380,490 V598" fill="none" stroke="#b8860b" stroke-width="2.5" marker-end="url(#ay)"/>
  <path d="M1490,624 H1540 V375 H1500" fill="none" stroke="#b8860b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ay)"/>
  <text x="1548" y="500" font-size="13" fill="#b8860b" transform="rotate(90 1548 500)">approve / override</text>

  <!-- Footer -->
  <text x="60" y="730" font-size="16" fill="#44546a">Deterministic = same answer on every run, rule id and version stored with each decision. LLM = Mistral Small 3.2, self-hosted on an EU GPU, sees request wording only, never patient data.</text>
  <text x="60" y="760" font-size="16" fill="#44546a">Also LLM-assisted, outside the gates: free text → structured request (applicant reviews it first) and "what to change" guidance on every no or hold.</text>
  <text x="60" y="810" font-size="16" font-weight="700" fill="#0b2341">Measured: 10/10 official requests · 57 unseen requests, 0 wrong decisions · 0 data leaks · slowest answer 2.4 s</text>
</svg>
